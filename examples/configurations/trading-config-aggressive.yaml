assets:
  - name: "Bitcoin (Crypto.com)"
    base_ticker_symbol: "BTC"
    quote_ticker_symbol: "USD"
    exchange: "CRYPTO_DOT_COM"
    min_quantity: 0.00005
    quote_decimals: 2
    quantity_decimals: 5
    candles_timeframe: "MIN1"
    schedule: 1
    guard_config:
      max_drawdown_period: 4
      max_drawdown_percentage: 0.60
      cooldown_timeout: 1
    consensus:
      buy: 0.9
      sell: 0.5
  - name: "Doge (Crypto.com)"
    base_ticker_symbol: "DOGE"
    quote_ticker_symbol: "USD"
    exchange: "CRYPTO_DOT_COM"
    min_quantity: 14
    quote_decimals: 6
    quantity_decimals: 0
    candles_timeframe: "MIN1"
    schedule: 1
    guard_config:
      max_drawdown_period: 4
      max_drawdown_percentage: 0.60
      cooldown_timeout: 1
    consensus:
      buy: 0.9
      sell: 0.5
dynamic_quantity: "max(min_qty, min(equity * 0.20 * confidence / close, equity * 0.25 / close))"