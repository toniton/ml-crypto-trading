assets:
  - name: "Bitcoin (Crypto.com)"
    base_ticker_symbol: "BTC"
    quote_ticker_symbol: "USD"
    exchange: "CRYPTO_DOT_COM"
    min_quantity: 0.00005
    quote_decimals: 2
    quantity_decimals: 5
    candles_timeframe: "MIN1"
    schedule: 1
    guard_config:
      max_drawdown_period: 8
      max_drawdown_percentage: 0.60
      cooldown_timeout: 5
  - name: "Doge (Crypto.com)"
    base_ticker_symbol: "DOGE"
    quote_ticker_symbol: "USD"
    exchange: "CRYPTO_DOT_COM"
    min_quantity: 14
    quote_decimals: 6
    quantity_decimals: 0
    candles_timeframe: "MIN1"
    schedule: 1
    guard_config:
      max_drawdown_period: 8
      max_drawdown_percentage: 0.60
      cooldown_timeout: 5
  - name: "CRO (Crypto.com)"
    base_ticker_symbol: "CRO"
    quote_ticker_symbol: "USD"
    exchange: "CRYPTO_DOT_COM"
    min_quantity: 19
    quote_decimals: 6
    quantity_decimals: 0
    candles_timeframe: "MIN1"
    schedule: 0
  - name: "BTTC (Binance)"
    base_ticker_symbol: "BTTC"
    quote_ticker_symbol: "USDC"
    exchange: "CCXT_BINANCE"
    separator: "/"
    min_quantity: 31515.9
    quote_decimals: 1
    quantity_decimals: 1
    candles_timeframe: "MIN1"
    schedule: 0
consensus:
  buy: 1.3
  sell: 0.5
dynamic_quantity: "max(min_qty, min((equity * risk_pct / close) * signal * (1.5 if rsi(14) > 60 else 1) * (1.5 if pnl > 0 else 0.5), equity * 0.1 / close))"
