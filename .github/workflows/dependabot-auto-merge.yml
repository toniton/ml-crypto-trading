name: Dependabot auto-merge

'on':
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          compat-lookup: true

      - name: Evaluate update type from metadata and git diff
        id: eval-diff
        run: |
          python3 - << 'EOF'
          import os, subprocess, re

          pr_url = os.environ.get("PR_URL", "")
          meta_type = os.environ.get("META_UPDATE_TYPE", "")

          def determine_update_type(meta, url):
              # If Dependabot metadata specifies the semver level, trust it
              if meta:
                  if "semver-major" in meta:
                      return "major"
                  if "semver-minor" in meta:
                      return "minor"
                  if "semver-patch" in meta:
                      return "patch"

              # Fallback to git diff analysis of manifest files (ignore lockfiles)
              try:
                  diff_text = subprocess.check_output(["gh", "pr", "diff", url], text=True)
              except Exception as e:
                  print(f"Error getting diff: {e}")
                  return "unknown"

              line_re = re.compile(r'^[+-]\s*(?:uses:\s*)?[\"\'\s]*([a-zA-Z0-9_\-\.\/\[\]]+)[\"\'\s]*(?:[~=^><]=?|@|:\s*\"?[\^~>=<]*)v?(\d+)(?:\.(\d+))?(?:\.(\d+))?')
              old_pkgs = {}
              new_pkgs = {}
              in_manifest = False

              for line in diff_text.splitlines():
                  if line.startswith("diff --git"):
                      path = line.split()[-1]
                      in_manifest = not any(lock in path for lock in ["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "poetry.lock"])
                      continue

                  if not in_manifest:
                      continue

                  if line.startswith("-") and not line.startswith("---"):
                      m = line_re.search(line)
                      if m:
                          pkg = m.group(1).lower()
                          v = tuple(int(x) if x is not None else 0 for x in m.groups()[1:])
                          old_pkgs[pkg] = v
                  elif line.startswith("+") and not line.startswith("+++"):
                      m = line_re.search(line)
                      if m:
                          pkg = m.group(1).lower()
                          v = tuple(int(x) if x is not None else 0 for x in m.groups()[1:])
                          new_pkgs[pkg] = v

              rank = {"unknown": 0, "patch": 1, "minor": 2, "major": 3}
              overall = "unknown"

              for pkg in set(old_pkgs.keys()) & set(new_pkgs.keys()):
                  old_v = old_pkgs[pkg]
                  new_v = new_pkgs[pkg]
                  if new_v[0] > old_v[0]:
                      t = "major"
                  elif new_v[1] > old_v[1]:
                      t = "minor"
                  elif len(new_v) > 2 and len(old_v) > 2 and new_v[2] > old_v[2]:
                      t = "patch"
                  else:
                      t = "unknown"
                  if rank[t] > rank[overall]:
                      overall = t

              return overall

          effective = determine_update_type(meta_type, pr_url)
          print(f"Metadata update type: {meta_type}")
          print(f"Effective update type: {effective}")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"update-type={effective}\n")
          EOF
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          META_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch updates
        if: steps.eval-diff.outputs.update-type == 'patch'
        run: |
          gh pr review --approve -b "Auto-approved patch update." "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bot approval & auto-merge for minor updates
        if: steps.eval-diff.outputs.update-type == 'minor'
        run: |
          gh pr review --approve -b "🤖 Automated Bot Approval: Minor dependency update approved. Will auto-merge once all CI checks pass." "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for manual review
        if: steps.eval-diff.outputs.update-type == 'major'
        run: |
          gh pr comment "$PR_URL" -b "⚠️ **Major Update Detected**: This pull request contains major version updates with potential breaking changes. Manual testing and approval are required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
